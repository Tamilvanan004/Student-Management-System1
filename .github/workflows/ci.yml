name: CI

on:
  push:
    branches: [main, professional-audit]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: student_management_db
      FRONTEND_ORIGINS: http://localhost:5500
      ADMIN_NAME: CI Administrator
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: StrongPass123
      RUN_INTEGRATION_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Dependency security audit
        run: npm audit --prefix backend --audit-level=high
      - name: Create database schema
        run: npm run db:setup --prefix backend
      - name: Seed CI administrator
        run: npm run admin:create --prefix backend
      - name: Run unit and MySQL integration tests
        run: npm test --prefix backend
      - name: Check JavaScript syntax
        run: |
          node --check backend/app.js
          node --check backend/server.js
          for file in frontend/js/*.js; do node --check "$file"; done
