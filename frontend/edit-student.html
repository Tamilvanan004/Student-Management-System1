<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Edit an existing student record."><title>Edit Student | Student Management System</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/student.css"></head><body><div class="dashboard-container"><aside class="sidebar"><div class="sidebar-logo"><i class="fa-solid fa-user-graduate"></i><h2>SMS</h2></div><nav class="sidebar-menu"><ul><li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li><li><a href="students.html"><i class="fa-solid fa-users"></i> Students</a></li><li><a href="add-student.html"><i class="fa-solid fa-user-plus"></i> Add Student</a></li><li class="active"><a href="students.html"><i class="fa-solid fa-user-pen"></i> Edit Student</a></li><li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li><li><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li></ul></nav></aside><main class="main-content"><header class="page-header"><div class="page-title"><h1>Edit Student</h1><p>Update the selected student record.</p></div><div class="page-actions"><a href="students.html" class="add-btn"><i class="fa-solid fa-arrow-left"></i> Back to Students</a></div></header><section class="student-form-section"><form id="editStudentForm" autocomplete="off"><div class="form-grid"><div class="form-group"><label for="studentId">Student ID</label><input type="text" id="studentId" readonly required></div><div class="form-group"><label for="studentName">Student Name</label><input type="text" id="studentName" minlength="2" maxlength="100" required></div><div class="form-group"><label for="email">Email Address</label><input type="email" id="email" maxlength="160" required></div><div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" minlength="7" maxlength="20" required></div><div class="form-group"><label for="gender">Gender</label><select id="gender" required><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="form-group"><label for="department">Department</label><select id="department" required><option value="AI & DS">AI & DS</option><option value="CSE">CSE</option><option value="IT">IT</option><option value="ECE">ECE</option><option value="EEE">EEE</option><option value="Mechanical">Mechanical</option></select></div><div class="form-group"><label for="year">Academic Year</label><select id="year" required><option value="I Year">I Year</option><option value="II Year">II Year</option><option value="III Year">III Year</option><option value="IV Year">IV Year</option></select></div><div class="form-group"><label for="dob">Date of Birth</label><input type="date" id="dob" required></div><div class="form-group"><label for="parentName">Parent / Guardian Name</label><input type="text" id="parentName" minlength="2" maxlength="100" required></div><div class="form-group"><label for="parentPhone">Parent Contact Number</label><input type="tel" id="parentPhone" minlength="7" maxlength="20" required></div><div class="form-group"><label for="status">Status</label><select id="status" required><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="form-group full-width"><label for="address">Address</label><textarea id="address" rows="5" minlength="5" maxlength="500" required></textarea></div></div><div class="form-actions"><button type="submit" class="save-btn"><i class="fa-solid fa-pen-to-square"></i> Update Student</button><button type="reset" class="reset-btn"><i class="fa-solid fa-rotate-left"></i> Reset</button><a href="students.html" class="cancel-btn"><i class="fa-solid fa-ban"></i> Cancel</a></div></form></section><footer class="page-footer"><p>© 2026 Student Management System | Developed by Tamil Vanan</p></footer></main></div><script src="js/api.js"></script><script src="js/edit-student.js"></script></body></html>
